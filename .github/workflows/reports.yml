name: Trading day reports
on:
  schedule:
    # GitHub delivers this repository's schedule events 5-10 hours late, so fan
    # out every 20 minutes over the 14 hours before the 14:20 (UTC 06:20) slot.
    # Only an event that actually starts 13:40-14:55 Asia/Shanghai delivers.
    - cron: '*/20 16-23 * * 0-4'
    - cron: '*/20 0-5 * * 1-5'
    - cron: '0,20 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '预览、测试发送或生产午后调度'
        type: choice
        default: preview
        options:
          - preview
          - test-send
          - scheduled
      research:
        description: '研究模式；比赛规则未核验时强制使用'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: fund-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    # Cheap clock check: schedule events that start before today's 13:40
    # Asia/Shanghai launch window are stale and exit without setup or alerts.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          now=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$EVENT" = schedule ] && [ "$((10#$now))" -lt 1340 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "- 早于今日 13:40 启动窗口（北京时间 $now），跳过过期调度事件" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  report:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Offline regression tests (no secrets)
        env:
          GITHUB_STEP_SUMMARY: ''
        run: python -m unittest discover -s tests -b
      - name: Discard test artefacts
        if: always()
        run: rm -rf runtime
      - name: Restore trusted persistent delivery state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FQ_ALLOW_STATE_BOOTSTRAP: ${{ vars.FQ_ALLOW_STATE_BOOTSTRAP }}
        run: python scripts/restore_notification_state.py
      - name: Collect full supported universe, evaluate and reserve report
        env:
          ACCOUNT_JSON: ${{ secrets.ACCOUNT_JSON }}
          FQ_SCHEDULE: ${{ github.event.schedule }}
          FQ_EVENT: ${{ github.event_name }}
          FQ_MODE: ${{ inputs.mode }}
          FQ_SLOT: ${{ inputs.mode == 'scheduled' && 'afternoon' || '' }}
          FQ_RESEARCH: ${{ inputs.research }}
        run: python scripts/cloud_run.py
      - name: Persist reservation before Telegram side effect
        uses: actions/upload-artifact@v4
        with:
          name: notification-state-reserved
          path: runtime/notification-state.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Deliver reserved report (default branch only)
        if: github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cloud_send.py
      - name: Persist delivery result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-state-final
          path: runtime/notification-state.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Public research evidence (no account report/outbox)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.run_id }}
          path: |
            reports/research/
            data/snapshot.json
            data/universe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Failure alert, including setup/test failures
        if: failure() && github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: src
          FQ_EVENT: ${{ github.event_name }}
          FQ_MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/failure_notice.py
      - name: Independent delivery heartbeat
        if: always() && github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: src
          FQ_EVENT: ${{ github.event_name }}
          FQ_MODE: ${{ inputs.mode }}
          FQ_JOB_STATUS: ${{ job.status }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python scripts/heartbeat.py
